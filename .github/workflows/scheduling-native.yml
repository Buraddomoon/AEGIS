name: Prepare and authorize native scheduling104
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: read
concurrency:
  group: aegis-scheduling104-native
  cancel-in-progress: false
jobs:
  native:
    name: Fresh Linux proposal then exact human approval
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked preparation tools
        run: |
          python -m pip install pip==26.2.2
          pip install --require-hashes --no-deps -r requirements-dev.lock
          pip install -e . --no-deps
          npm --prefix apps/web ci
      - name: Build dedicated images and prepare package without starting Lab
        run: python scripts/scheduling_assay.py prepare
      - name: Publish public proposal only, never private PKI or credentials
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheduling104-proposal-${{ github.run_id }}
          path: .local/scheduling104-public/manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Wait for later exact package approval from initiating human
        run: python scripts/scheduling_assay.py wait
      - name: Execute exactly two approved native occurrences and cleanup
        run: python scripts/scheduling_assay.py run
      - name: Preserve sanitized own proof, never keys or raw logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheduling104-proof-${{ github.run_id }}
          path: |
            .local/scheduling104-public/*.json
            .local/scheduling104-public/*.html
            .local/scheduling104-public/*.pdf
            .local/scheduling104-public/*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

name: Recommendation Demo acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aegis-recommendation-demo
  cancel-in-progress: false
jobs:
  demo:
    name: Synthetic recommendation browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aegis_ci
          POSTGRES_USER: aegis_ci
          POSTGRES_PASSWORD: ephemeral-ci-database-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U aegis_ci -d aegis_ci" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql+psycopg://aegis_ci:ephemeral-ci-database-only@localhost:5432/aegis_ci
      REDIS_URL: redis://localhost:6379/0
      AEGIS_E2E_SCREENSHOTS: ../../.local/e2e/screenshots
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked application and build SPA
        run: |
          python -m pip install pip==26.2.2
          pip install --require-hashes --no-deps -r requirements-dev.lock
          pip install -e . --no-deps
          make sigma-converter-setup SIGMA_SETUP_PYTHON=python
          npm --prefix apps/web ci
          npm --prefix apps/web run build
      - name: Demo browser with real API and disposable schema
        run: |
          test -x /usr/bin/firefox
          python scripts/e2e.py
          python scripts/verify_recommendation_e2e.py
      - name: Preserve synthetic recommendation proof only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recommendation-demo-${{ github.sha }}
          path: |
            .local/e2e/recommendations.json
            .local/e2e/recommendations.html
            .local/e2e/recommendations.pdf
            .local/e2e/screenshots/recommendations.png
            .local/e2e/screenshots/recommendations-mobile.png
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

# Opt-in only. Merge after root Compose and linux/compose.yml; see README.
name: aegis-linux-lab
services:
  runner:
    build:
      context: .
      dockerfile: labs/linux/Dockerfile
  api:
    ports: !override ['127.0.0.1:18785:8080']
    environment: &linux-env
      PUBLIC_ORIGIN: http://localhost:18785
      LINUX_RUNNER_CONFIG: /run/secrets/controller_connection
      WAZUH_URL: ''
      WAZUH_ALLOWED_IP: ''
      WAZUH_USERNAME: ''
      WAZUH_PASSWORD: ''
      WAZUH_CA_BUNDLE: ''
      WAZUH_COLLECTION_CONFIG: ''
    secrets: [controller_server_ca, controller_client_cert, controller_client_key, controller_connection]
    networks:
      backend: {}
      ingress: {}
      isolated: {ipv4_address: 192.168.253.4}
    restart: 'no'
  worker:
    environment: *linux-env
    secrets: [controller_server_ca, controller_client_cert, controller_client_key, controller_connection]
    networks:
      backend: {}
      isolated: {ipv4_address: 192.168.253.5}
    restart: 'no'
  db:
    restart: 'no'
  redis:
    restart: 'no'

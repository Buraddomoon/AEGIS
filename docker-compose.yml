name: aegis
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U aegis -d aegis']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/init_env.py}
    command: [/bin/sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 96mb --maxmemory-policy noeviction']
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m
    restart: unless-stopped
  migrate:
    build: .
    image: aegis-local:0.1
    command: [/bin/sh, -c, 'alembic upgrade head && python -m aegis.cli seed && python -m aegis.cli grant-runtime']
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://aegis:${POSTGRES_PASSWORD}@db:5432/aegis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:18780}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      WAZUH_URL: ${WAZUH_URL:-}
      WAZUH_ALLOWED_IP: ${WAZUH_ALLOWED_IP:-}
      WAZUH_USERNAME: ${WAZUH_USERNAME:-}
      WAZUH_PASSWORD: ${WAZUH_PASSWORD:-}
      WAZUH_CA_BUNDLE: ${WAZUH_CA_BUNDLE:-}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run scripts/init_env.py}
    networks: [backend]
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 256m
  api:
    image: aegis-local:0.1
    command: [uvicorn, aegis.main:app, --host, 0.0.0.0, --port, '8080', --no-proxy-headers]
    environment: &runtime-env
      DATABASE_URL: postgresql+psycopg://aegis_app:${APP_DB_PASSWORD}@db:5432/aegis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:18780}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      WAZUH_URL: ${WAZUH_URL:-}
      WAZUH_ALLOWED_IP: ${WAZUH_ALLOWED_IP:-}
      WAZUH_USERNAME: ${WAZUH_USERNAME:-}
      WAZUH_PASSWORD: ${WAZUH_PASSWORD:-}
      WAZUH_CA_BUNDLE: ${WAZUH_CA_BUNDLE:-}
    ports: ['127.0.0.1:18780:8080']
    networks: [backend, ingress]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    restart: unless-stopped
  worker:
    image: aegis-local:0.1
    command: [python, -m, aegis.worker]
    environment: *runtime-env
    networks: [backend]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    restart: unless-stopped
networks:
  backend:
    internal: true
  ingress:
volumes:
  postgres-data:

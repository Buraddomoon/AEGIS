# Reference only; opt-in app mounts. Does not install/start a Wazuh service.
# Requires an approved lab and existing trusted files; review before using.
services:
  api:
    environment:
      WAZUH_COLLECTION_CONFIG: /run/secrets/wazuh_collection
      WAZUH_CA_BUNDLE: /run/secrets/wazuh_ca
    secrets: [wazuh_collection, wazuh_ca]
  worker:
    environment:
      WAZUH_COLLECTION_CONFIG: /run/secrets/wazuh_collection
      WAZUH_CA_BUNDLE: /run/secrets/wazuh_ca
    secrets: [wazuh_collection, wazuh_ca]
secrets:
  wazuh_collection:
    file: ${AEGIS_WAZUH_CONFIG_DIR:?Reviewed local config directory required}/collection.json
  wazuh_ca:
    file: ${AEGIS_WAZUH_CONFIG_DIR}/ca.pem

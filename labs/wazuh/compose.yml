# PREPARATION ONLY: merge after root Compose, linux/compose.yml and linux/platform.yml.
# Requires separate, explicit authorization before hash/pull/build/up/assay.
name: aegis-wazuh-lab
services:
  runner:
    image: aegis-wazuh-runner:local
    networks:
      isolated: {ipv4_address: 172.30.89.2}
    tmpfs: !reset []
    volumes:
      - workspace:/work
  observer:
    image: aegis-wazuh-runner:local
    entrypoint: [python, -m, aegis.marker_observer]
    command:
      - --workspace
      - /work
      - --laboratory-id
      - ${AEGIS_RUNNER_LABORATORY_ID:?Prepare private Wazuh configuration}
      - --asset-id
      - ${AEGIS_RUNNER_ASSET_ID:?Prepare private Wazuh configuration}
      - --log-directory
      - /observation-log
    network_mode: none
    volumes:
      - workspace:/work:ro
      - observations:/observation-log
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 16
    mem_limit: 96m
    cpus: 0.25
    restart: 'no'
    healthcheck:
      test: [CMD, python, -c, "from pathlib import Path; p=Path('/observation-log/observations.jsonl'); assert p.is_file() and p.stat().st_size <= 1048576"]
      interval: 2s
      timeout: 2s
      retries: 10
  controller:
    image: aegis-wazuh-runner:local
  migrate:
    image: aegis-wazuh-platform:local
  api:
    image: aegis-wazuh-platform:local
    ports: !override ['127.0.0.1:18786:8080']
    environment: &wazuh-app
      PUBLIC_ORIGIN: http://localhost:18786
      WAZUH_URL: ${WAZUH_URL:?Prepare Wazuh configuration}
      WAZUH_ALLOWED_IP: ${WAZUH_ALLOWED_IP:?Prepare Wazuh configuration}
      WAZUH_USERNAME: aegis_reader
      WAZUH_PASSWORD: ${WAZUH_PASSWORD:?Prepare Wazuh configuration}
      WAZUH_CA_BUNDLE: /run/secrets/wazuh_ca
      WAZUH_COLLECTION_CONFIG: /run/secrets/wazuh_collection
    secrets: [controller_server_ca, controller_client_cert, controller_client_key, controller_connection, wazuh_ca, wazuh_collection]
    networks:
      isolated: {ipv4_address: 172.30.89.4}
      telemetry: {ipv4_address: 172.30.90.5}
  worker:
    image: aegis-wazuh-platform:local
    environment: *wazuh-app
    secrets: [controller_server_ca, controller_client_cert, controller_client_key, controller_connection, wazuh_ca, wazuh_collection]
    networks:
      isolated: {ipv4_address: 172.30.89.5}
      telemetry: {ipv4_address: 172.30.90.6}
  wazuh.indexer:
    image: ${AEGIS_WAZUH_INDEXER_IMAGE:?Prepare pinned image configuration}
    platform: linux/amd64
    hostname: wazuh.indexer
    user: '1000:0'
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    networks:
      telemetry: {ipv4_address: 172.30.90.2}
    volumes:
      - indexer-data:/var/lib/wazuh-indexer
      - type: bind
        source: ./labs/wazuh/config/indexer.yml
        target: /usr/share/wazuh-indexer/config/opensearch.yml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./labs/wazuh/config/roles.yml
        target: /usr/share/wazuh-indexer/config/opensearch-security/roles.yml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./labs/wazuh/config/roles_mapping.yml
        target: /usr/share/wazuh-indexer/config/opensearch-security/roles_mapping.yml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${AEGIS_WAZUH_CONFIG_DIR:?Prepare Wazuh configuration}/internal_users.yml
        target: /usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
        read_only: true
        bind: {create_host_path: false}
    secrets:
      - {source: wazuh_ca, target: /usr/share/wazuh-indexer/config/certs/root-ca.pem}
      - {source: indexer_cert, target: /usr/share/wazuh-indexer/config/certs/indexer.pem}
      - {source: indexer_key, target: /usr/share/wazuh-indexer/config/certs/indexer-key.pem}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    pids_limit: 512
    mem_limit: 3g
    cpus: 2
    restart: 'no'
  wazuh.manager:
    image: ${AEGIS_WAZUH_MANAGER_IMAGE:?Prepare pinned image configuration}
    platform: linux/amd64
    hostname: wazuh.manager
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: aegis_ingest
      INDEXER_PASSWORD: ${AEGIS_INDEXER_INGEST_PASSWORD:?Prepare Wazuh configuration}
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /run/secrets/wazuh_ca
      SSL_CERTIFICATE: /run/secrets/filebeat_cert
      SSL_KEY: /run/secrets/filebeat_key
      API_USERNAME: wazuh
      API_PASSWORD: ${AEGIS_WAZUH_API_PASSWORD:?Prepare Wazuh configuration}
    networks:
      telemetry: {ipv4_address: 172.30.90.3}
    volumes:
      - manager-etc:/var/ossec/etc
      - manager-logs:/var/ossec/logs
      - manager-queue:/var/ossec/queue
      - type: bind
        source: ./labs/wazuh/config/manager.xml
        target: /wazuh-config-mount/etc/ossec.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./labs/wazuh/config/api.yml
        target: /wazuh-config-mount/api/configuration/api.yaml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./labs/wazuh/rules.example.xml
        target: /wazuh-config-mount/etc/rules/aegis_marker.xml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${AEGIS_WAZUH_CONFIG_DIR}/client.keys
        target: /wazuh-config-mount/etc/client.keys
        read_only: true
        bind: {create_host_path: false}
    secrets: [wazuh_ca, filebeat_cert, filebeat_key]
    security_opt: [no-new-privileges:true]
    pids_limit: 384
    mem_limit: 2g
    cpus: 1.5
    restart: 'no'
  wazuh.agent:
    image: ${AEGIS_WAZUH_AGENT_IMAGE:?Prepare pinned image configuration}
    platform: linux/amd64
    hostname: aegis-marker
    environment:
      WAZUH_MANAGER_SERVER: wazuh.manager
    networks:
      telemetry: {ipv4_address: 172.30.90.4}
    volumes:
      - observations:/var/log/aegis:ro
      - agent-queue:/var/ossec/queue
      - type: bind
        source: ./labs/wazuh/config/agent.xml
        target: /wazuh-config-mount/etc/ossec.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${AEGIS_WAZUH_CONFIG_DIR}/client.keys
        target: /wazuh-config-mount/etc/client.keys
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      observer: {condition: service_healthy}
      wazuh.manager: {condition: service_started}
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    restart: 'no'
networks:
  isolated:
    ipam:
      config: !override [{subnet: 172.30.89.0/29}]
  telemetry:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config: [{subnet: 172.30.90.0/29}]
volumes:
  workspace:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,uid=10001,gid=10001,mode=0700,noexec,nosuid,nodev
  observations:
  indexer-data:
  manager-etc:
  manager-logs:
  manager-queue:
  agent-queue:
secrets:
  wazuh_ca:
    file: ${AEGIS_WAZUH_CONFIG_DIR}/pki/root-ca.pem
  indexer_cert:
    file: ${AEGIS_WAZUH_CONFIG_DIR}/pki/indexer.pem
  indexer_key:
    file: ${AEGIS_WAZUH_CONFIG_DIR}/pki/indexer-key.pem
  filebeat_cert:
    file: ${AEGIS_WAZUH_CONFIG_DIR}/pki/filebeat.pem
  filebeat_key:
    file: ${AEGIS_WAZUH_CONFIG_DIR}/pki/filebeat-key.pem
  wazuh_collection:
    file: ${AEGIS_WAZUH_CONFIG_DIR}/collection.json

name: Validate AEGIS
on:
  push:
    branches: [main]
    # Security policy JSON remains executable input and must trigger validation.
    paths-ignore: ['**/*.md', '*.md', 'docs/images/**', 'LICENSE']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aegis-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Python partition ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aegis_ci
          POSTGRES_USER: aegis_ci
          POSTGRES_PASSWORD: ephemeral-ci-database-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U aegis_ci -d aegis_ci" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://aegis_ci:ephemeral-ci-database-only@localhost:5432/aegis_ci
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: |
          python -m pip install pip==26.2.2
          pip install --require-hashes --no-deps -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Lint and types
        if: matrix.shard == 0
        run: |
          ruff check apps/api scripts tests
          ruff format --check apps/api scripts tests
          mypy
      - name: PostgreSQL tests in complementary partition
        run: python scripts/run_ci_tests.py --shard ${{ matrix.shard }}
      - name: Dependency advisory review
        if: matrix.shard == 0
        run: python scripts/audit_dependencies.py
  web:
    name: React validation
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm --prefix apps/web ci
      - name: Lint format tests build and advisory review
        run: |
          npm --prefix apps/web run lint
          npm --prefix apps/web run format:check
          npm --prefix apps/web test
          npm --prefix apps/web run build
          npm --prefix apps/web audit --audit-level=high

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-purple"
version = "0.2.0"
description = "Evidence-based purple team validation, starting with an explicit synthetic demo"
requires-python = ">=3.13,<3.15"
license = "MIT"
dependencies = [
  "fastapi==0.156.0", "pydantic==2.14.1", "pydantic-settings==2.16.1",
  "sqlalchemy==2.1.5", "alembic==1.20.0", "psycopg[binary]==3.3.6",
  "redis==8.1.0", "httpx==0.28.1", "argon2-cffi==25.1.0",
  "uvicorn==0.54.0", "pysigma==2.0.1", "packaging==26.3", "PyYAML>=6.0.3,<7",
  "reportlab==5.1.0"
]

[project.optional-dependencies]
backup = ["pyrage==1.4.0"]
dev = ["pyrage==1.4.0", "pytest==9.1.1", "pytest-cov>=7,<8", "ruff==0.17.1", "mypy==2.4.0", "types-PyYAML", "pip-audit==2.10.1", "pypdf==6.21.4"]

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.13"
files = ["apps/api/aegis/domain"]
strict = true
